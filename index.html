<body>
<div class=app><div class=hero><div class=brand>PLAY CALL SERIES</div><h1>FRANCHISE <span>MODE</span></h1><div class=sub>Prototype Ver.0.6.1 — ONLINE MULTIPLAYER</div></div><div id=game></div></div>
<div class=bottom><div class=bottomin><button onclick=openLeague()>🏈 ROSTERS</button><button onclick=openHistory()>📜 DRAFT</button><button onclick=openResults()>🏆 RESULTS</button><button onclick=openFA()>🧾 FA</button><button onclick=resetGame()>↻ RESET</button></div></div>
<div id=modal class=modal onclick="if(event.target===this)this.classList.remove('show')"><div class=sheet><div id=modalbody></div><button class=ghost style="width:100%;margin-top:10px" onclick="document.getElementById('modal').classList.remove('show')">閉じる</button></div></div>
<script>
const VERSION="0.6.1",KEY="pc_franchise_v0610";
const BASE_CAPS={1:100,2:115,3:125},NEED={HC:1,QB:1,OF:3,DF:3},POS=["HC","QB","OF","DF"];
const COUNTS={QB:{S:3,A:9,B:10,C:8},HC:{S:3,A:9,B:10,C:8},OF:{S:9,A:27,B:30,C:24},DF:{S:9,A:27,B:30,C:24}};
const RANGE={S:[90,99],A:[80,89],B:[70,79],C:[60,69]},RSAL={S:20,A:15,B:5,C:1},TYPES=[["王道",70],["晩成",15],["即戦力",10],["一発屋",5]];
function code(){return Math.random().toString(36).slice(2,6).toUpperCase()}
function fresh(){return{room:{id:code(),season:1,phase:"setup",maxSeason:7,firstDraftOrder:[],caps:{1:100,2:115,3:125},nextCap:null},players:[],pool:[],fa:[],market:{QB:[],HC:[],OF:[],DF:[]},draft:{order:[],turn:0,pickLimit:{},pickedTotal:{}},viewPos:"HC",rosterPos:"HC",rosterPlayer:0,waiver:[],nextWaiver:[],waiverSnapshot:null,draftHistory:[],resultsHistory:[],campEvents:[],campPlayer:0,campPos:"HC",regular:{schedule:[],finalStandings:[]},postseason:{seeds:[],qualifiers:[],formEvents:[],reorgQueue:[],reorgIndex:0,games:[],roundIndex:0,championId:null,runnerUpId:null},gameDay:null,playoffPos:"HC"}}
let S=load();function load(){try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){return fresh()}}function save(){if(S?.room?.mode==="online"&&!APPLYING_REMOTE){S.room.syncRev=(S.room.syncRev||0)+1;S.room.syncAt=Date.now()}saveLocal();if(S?.room?.mode==="online"&&NET?.roomCode&&!APPLYING_REMOTE)queueRemoteState()}
function topNow(){setTimeout(()=>window.scrollTo(0,0),0)}function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function wt(){let r=Math.random()*100,n=0;for(const [t,w] of TYPES){n+=w;if(r<n)return t}return"王道"}
function grow(rank,type,r,stage){if(stage===1)return r;let lo=RANGE[rank][0],hi=RANGE[rank][1];if(rank==="S"){if(stage===2)return clamp(r+ri(2,10),92,108);if(type==="晩成")return ri(105,115);if(type==="一発屋")return ri(95,101);if(type==="即戦力")return ri(98,104);return ri(104,112)}if(stage===2){if(type==="一発屋")return clamp(r+ri(3,7),lo,hi);if(type==="晩成")return clamp(r+ri(1,4),lo,hi);return clamp(r+ri(1,5),lo,hi)}if(type==="晩成")return ri(Math.max(lo,hi-2),hi);if(type==="一発屋")return ri(lo,Math.min(hi,lo+3));return ri(Math.max(lo,hi-4),hi)}
function salary(rank,p,stage){
 if(stage===1)return RSAL[rank];
 // Ver.0.3.0: stage/rank bands never overlap, so a stronger rank cannot become cheaper at the boundary.
 const bands={
   2:{C:[1,10],B:[11,20],A:[21,30],S:[31,40]},
   // Ver.0.6.1: LEGEND is a veteran-value contract tier.
   3:{C:[3,9],B:[10,16],A:[17,24],S:[25,34]}
 };
 const rr=bands[stage][rank];
 const pr=rank==="S"?(stage===2?[92,108]:[95,115]):RANGE[rank];
 const t=clamp((p-pr[0])/(pr[1]-pr[0]),0,1);
 return Math.round(rr[0]+t*(rr[1]-rr[0]));
}
function makePool(){let a=[];for(const pos of POS){let serial=1;for(const [rank,n] of Object.entries(COUNTS[pos]))for(let i=0;i<n;i++){let type=wt(),r=ri(...RANGE[rank]),f=grow(rank,type,r,2),l=grow(rank,type,r,3);a.push({uid:`${pos}-${rank}-${String(serial++).padStart(2,"0")}-${Math.random().toString(36).slice(2,5)}`,pos,rank,type,age:1,owner:null,status:"free",faSince:null,draftSeason:null,stages:[{name:"ROOKIE",power:r,salary:RSAL[rank]},{name:"FRANCHISE",power:f,salary:salary(rank,f,2)},{name:"LEGEND",power:l,salary:salary(rank,l,3)}]})}}return a}
function st(c){return c.stages[c.age-1]}function card(id){return S.pool.find(c=>c.uid===id)}
function pl(i,n,cpu=false){return{id:i,name:n||`PLAYER ${i+1}`,cpu,owned:[],active:[],practice:[],stars:0,vp:0}}
function capLimit(season=S.room.season){return (S.room.caps&&S.room.caps[season])||BASE_CAPS[season]||125}
function ensureFutureCap(season){if(season<=3)return capLimit(season);if(!S.room.caps[season])S.room.caps[season]=ri(125,150);return S.room.caps[season]}
function modTotal(c){return (c.mods||[]).reduce((a,m)=>a+m.value,0)}
function ep(c){return (st(c)?.power||0)+modTotal(c)}
function ac(p,pos){return p.active.filter(id=>card(id)?.pos===pos).length}
function posIndex(pos){return POS.indexOf(pos)}
function sortByPos(cards){return [...cards].sort((a,b)=>posIndex(a.pos)-posIndex(b.pos)||ep(b)-ep(a)||st(a).salary-st(b).salary)}
function criticalPos(pos){return pos==="HC"||pos==="QB"}
function allOtherTeamsHaveStarter(p,pos){return S.players.every(x=>x.id===p.id||ac(x,pos)>=NEED[pos])}
function cpuPracticeCriticalOK(p,cs){
 for(const pos of ["HC","QB"]){
   let n=cs.filter(c=>c.pos===pos).length;
   if(n>1)return false;
   if(n===1&&!allOtherTeamsHaveStarter(p,pos))return false;
 }
 return true
}
function releaseCriticalPSForLeague(){
 // CPU may keep at most one HC and one QB on PS.
 for(const p of S.players.filter(x=>x.cpu)){
   for(const pos of ["HC","QB"]){
     let xs=p.practice.map(card).filter(c=>c&&c.pos===pos).sort((a,b)=>cpuCardValue(b)-cpuCardValue(a));
     for(const c of xs.slice(1)){
       p.practice=p.practice.filter(id=>id!==c.uid);
       p.owned=p.owned.filter(id=>id!==c.uid);
       addFA(c,S.room.season);
     }
   }
 }
 // If any team currently lacks a mandatory HC/QB, CPU PS cannot lock that position away.
 for(const pos of ["HC","QB"]){
   let missing=S.players.filter(p=>ac(p,pos)<NEED[pos]).length;
   while(missing>0){
     let holders=S.players.filter(p=>p.cpu).flatMap(p=>p.practice.map(card)
       .filter(c=>c&&c.pos===pos).map(c=>({p,c})));
     if(!holders.length)break;
     holders.sort((a,b)=>cpuCardValue(a.c)-cpuCardValue(b.c));
     let {p,c}=holders[0];
     p.practice=p.practice.filter(id=>id!==c.uid);
     p.owned=p.owned.filter(id=>id!==c.uid);
     addFA(c,S.room.season);
     missing--;
   }
 }
}
function legendBonus(c){if(!c||c.age!==3)return 1;if(c.rank==="S")return 1.20;if(c.rank==="A")return 1.10;return 1}
function hcMultiplier(p){
 let id=p.active.find(id=>card(id)?.pos==="HC");
 if(!id)return 1;
 let hc=card(id);
 if(hc.age===1)return .95;
 return({C:.97,B:1,A:1.05,S:1.10})[hc.rank]??1;
}
function powerBreakdown(p){
 const active=p.active.map(card).filter(Boolean);
 const qb=active.find(c=>c.pos==="QB");
 const hc=active.find(c=>c.pos==="HC");
 const ofs=active.filter(c=>c.pos==="OF");
 const dfs=active.filter(c=>c.pos==="DF");

 let qbPower=qb?(ep(qb)*1.5*legendBonus(qb)):0;
 let hcPower=hc?(ep(hc)*legendBonus(hc)):0;

 let ofPower=ofs.reduce((s,c)=>s+ep(c),0);
 let ofBonus=ofs.some(c=>c.age===3&&c.rank==="S")?1.20:(ofs.some(c=>c.age===3&&c.rank==="A")?1.10:1);
 ofPower*=ofBonus;

 let dfPower=dfs.reduce((s,c)=>s+ep(c),0);
 let dfBonus=dfs.some(c=>c.age===3&&c.rank==="S")?1.20:(dfs.some(c=>c.age===3&&c.rank==="A")?1.10:1);
 dfPower*=dfBonus;

 const base=hcPower+qbPower+ofPower+dfPower;
 const mult=hcMultiplier(p);
 const starBonus=(p.stars||0)*10;
 return {base,mult,starBonus,total:Math.round(base*mult)+starBonus};
}
function basePower(p){return powerBreakdown(p).base}
function starBonus(p){return (p.stars||0)*10}
function power(p){return powerBreakdown(p).total}
function cap(p){return p.active.reduce((a,id)=>a+(st(card(id))?.salary||0),0)}
function psCap(p){return p.practice.reduce((a,id)=>a+(st(card(id))?.salary||0),0)}
function totalCap(p){return cap(p)+psCap(p)}
function totalCapLimit(){return capLimit()+30}
function waiverByPower(){return [...S.players].sort((a,b)=>power(a)-power(b)||cap(a)-cap(b)||a.id-b.id).map(p=>p.id)}
function rankIndex(r){return({S:0,A:1,B:2,C:3})[r]??9}function sortFA(a){return [...a].sort((x,y)=>rankIndex(x.rank)-rankIndex(y.rank)||ep(y)-ep(x)||st(x).salary-st(y).salary)}
function eligiblePos(season){if(season===1)return[...POS];return[(season%2===0?"HC":"QB"),"OF","DF"]}function pickCountForSeason(season){return season===1?8:4}

async function startSeason1Draft(){
  if(isOnline()&&!NET.isHost)return alert("HOSTのみドラフトを開始できます。");
  if(ONLINE_TRANSITION)return;
  if(!isOnline()){beginDraft(1);save();render();topNow();return}
  ONLINE_TRANSITION=true;
  try{
    beginDraft(1);
    // IMPORTANT: reserve a newer revision BEFORE waiting for any older queued write.
    // This prevents a late LOTTERY snapshot from rewinding the HOST back from DRAFT.
    S.room.syncRev=(S.room.syncRev||0)+1;
    S.room.syncAt=Date.now();
    saveLocal();
    render();topNow();
    await pushOnlineSnapshotNow(JSON.parse(JSON.stringify(S)),"draft");
  }catch(e){
    NET.lastError=e.message;
    renderNetBarOnly();
    alert(`ドラフト画面には進みましたが、Firebase同期を再試行しています。\n${e.message}`);
    // Do not rewind the local draft. The normal queue/polling path will retry on the next action.
    queueRemoteState();
  }finally{ONLINE_TRANSITION=false}
}

function combo(arr,k){if(k===0)return[[]];if(arr.length<k)return[];let out=[];for(let i=0;i<=arr.length-k;i++)for(const tail of combo(arr.slice(i+1),k-1))out.push([arr[i],...tail]);return out}
function cpuDraftScore(p,c){
 let s=ep(c),sal=st(c).salary,score=s-sal*.34+Math.random()*4;
 // Scarce top-end talent should not be treated as only a few points better than depth.
 score+=c.rank==="S"?12:c.rank==="A"?5:0;
 let ownedPos=p.owned.map(card).filter(x=>x&&x.pos===c.pos);
 let expiring=ownedPos.filter(x=>x.age===3).length;
 if(c.pos==="QB"){
   let best=ownedPos.length?Math.max(...ownedPos.map(ep)):0;
   score=s*1.52-sal*.24+(ownedPos.length?Math.max(-8,(s-best)*.7):24)+(expiring?16:0)+(c.rank==="S"?10:0);
 }
 if(c.pos==="HC"){
   let future=c.rank==="S"?1.10:c.rank==="A"?1.05:c.rank==="B"?1:.97;
   let best=ownedPos.length?Math.max(...ownedPos.map(ep)):0;
   score=s+future*58-sal*.26+(ownedPos.length?Math.max(-7,(s-best)*.45):18)+(expiring?14:0)+(c.rank==="S"?8:0);
 }
 if(criticalPos(c.pos)){
   let alreadyThisDraft=draftedPosCount(p,c.pos);
   if(alreadyThisDraft>=1)score-=60;
   else if(ownedPos.length>=2&&!expiring)score-=28;
   else if(ownedPos.length>=1&&!expiring)score-=8;
 }
 if(c.pos==="OF"||c.pos==="DF"){
   let need=Math.max(0,NEED[c.pos]-ownedPos.length);
   score+=need*7+expiring*5;
   if(c.rank==="S")score+=5;
 }
 if(c.age===1)score+=4;
 score+=({"王道":0.5,"晩成":3,"即戦力":2,"一発屋":0.5})[c.type]||0;
 return score
}
function cpuPick(){
 let p=cur();if(!p||!p.cpu)return;
 let choices=[];for(const pos of eligiblePos(S.room.season))for(const uid of S.market[pos]||[]){let c=card(uid);if(c&&c.status==="free"&&!season1PosFull(p,pos))choices.push(c)}
 if(!choices.length)return;
 if(S.room.season===1){
   let current=p.owned.reduce((s,id)=>s+st(card(id)).salary,0);
   choices=choices.filter(c=>{
     let need={QB:NEED.QB-draftedPosCount(p,"QB"),HC:NEED.HC-draftedPosCount(p,"HC"),OF:NEED.OF-draftedPosCount(p,"OF"),DF:NEED.DF-draftedPosCount(p,"DF")};
     need[c.pos]--;
     let reserve=0;
     for(const pos of POS)for(let i=0;i<Math.max(0,need[pos]);i++){
       let vals=(S.market[pos]||[]).map(card).filter(x=>x&&x.status==="free"&&x.uid!==c.uid).map(x=>st(x).salary).sort((a,b)=>a-b);
       reserve+=vals[i]??1
     }
     return current+st(c).salary+reserve<=capLimit()
   })
 }
 if(!choices.length){
   for(const pos of eligiblePos(S.room.season))for(const uid of S.market[pos]||[]){let c=card(uid);if(c&&c.status==="free"&&!season1PosFull(p,pos))choices.push(c)}
 }
 choices.sort((a,b)=>cpuDraftScore(p,b)-cpuDraftScore(p,a));pick(choices[0].uid)
}
function cpuRosterLegal(p){
 let w=warning(p);
 return p.active.length===8&&!w.missing.length&&cap(p)<=capLimit()&&totalCap(p)<=totalCapLimit()&&p.practice.length<=3
}
function cpuCardValue(c){
 let v=ep(c)-st(c).salary*.30+(c.age===1?6:0);
 if(c.pos==="QB")v=ep(c)*1.45-st(c).salary*.24;
 if(c.pos==="HC"){let m=c.age===1?.95:({C:.97,B:1,A:1.05,S:1.10}[c.rank]||1);v=ep(c)+m*50-st(c).salary*.25}
 if(c.age===3&&c.rank==="S")v+=10;
 if(c.age===3&&c.rank==="A")v+=6;
 return v
}
function cpuCandidateCards(p,pos,includeFA=true,limit=7){
 let own=p.owned.map(card).filter(c=>c&&c.pos===pos);
 let fas=includeFA?S.fa.map(card).filter(c=>c&&c.pos===pos&&c.status==="fa"):[];
 let all=[...own,...fas],seen=new Set(),out=[];
 let push=c=>{if(c&&!seen.has(c.uid)){seen.add(c.uid);out.push(c)}};
 [...all].sort((a,b)=>cpuCardValue(b)-cpuCardValue(a)).slice(0,4).forEach(push);
 [...all].sort((a,b)=>st(a).salary-st(b).salary||ep(b)-ep(a)).slice(0,3).forEach(push);
 own.sort((a,b)=>cpuCardValue(b)-cpuCardValue(a)).slice(0,2).forEach(push);
 return out.slice(0,limit)
}
function cpuPosCombos(cards,n){
 if(n===1)return cards.map(c=>({ids:[c.uid],salary:st(c).salary}));
 return combo(cards,n).map(cs=>({ids:cs.map(c=>c.uid),salary:cs.reduce((s,c)=>s+st(c).salary,0)}))
}
function cpuFindActivePlan(p,includeFA=true){
 let q=cpuPosCombos(cpuCandidateCards(p,"QB",includeFA),1),
     h=cpuPosCombos(cpuCandidateCards(p,"HC",includeFA),1),
     os=cpuPosCombos(cpuCandidateCards(p,"OF",includeFA),3),
     ds=cpuPosCombos(cpuCandidateCards(p,"DF",includeFA),3);
 if(!q.length||!h.length||!os.length||!ds.length)return null;
 let oldA=[...p.active],oldP=[...p.practice],best=null,limit=capLimit();
 for(const qc of q)for(const hc of h){
   let baseSal=qc.salary+hc.salary;if(baseSal>limit)continue;
   for(const oc of os){
     let sal3=baseSal+oc.salary;if(sal3>limit)continue;
     for(const dc of ds){
       let salary=sal3+dc.salary;if(salary>limit)continue;
       let ids=[...qc.ids,...hc.ids,...oc.ids,...dc.ids];
       p.active=ids;p.practice=[];
       let pw=power(p);
       if(!best||pw>best.pw||(pw===best.pw&&salary<best.salary))best={active:[...ids],pw,salary};
     }
   }
 }
 p.active=oldA;p.practice=oldP;
 return best
}
function cpuPracticePlan(p,activeIds,includeFA=true){
 let budget=totalCapLimit()-activeIds.reduce((s,id)=>s+st(card(id)).salary,0);
 if(budget<=0)return[];
 let activeSet=new Set(activeIds);
 let pool=[...p.owned.map(card).filter(Boolean),...(includeFA?S.fa.map(card).filter(c=>c&&c.status==="fa"):[])]
   .filter(c=>!activeSet.has(c.uid));
 let seen=new Set();pool=pool.filter(c=>!seen.has(c.uid)&&seen.add(c.uid));
 pool.sort((a,b)=>cpuCardValue(b)-cpuCardValue(a));

 // Keep enough choices to fill PS aggressively, but do not hoard mandatory positions.
 let shortlist=[],ss=new Set(),push=c=>{if(c&&!ss.has(c.uid)){ss.add(c.uid);shortlist.push(c)}};
 pool.slice(0,10).forEach(push);
 [...pool].sort((a,b)=>st(a).salary-st(b).salary||cpuCardValue(b)-cpuCardValue(a)).slice(0,8).forEach(push);
 shortlist=shortlist.slice(0,14);

 let best={ids:[],score:-1,salary:0,count:0};
 for(let n=1;n<=3;n++)for(const cs of combo(shortlist,n)){
   if(!cpuPracticeCriticalOK(p,cs))continue;
   let salary=cs.reduce((s,c)=>s+st(c).salary,0);if(salary>budget)continue;
   // Prefer filling PS when it is legal, then maximize future/depth value.
   let score=cs.reduce((s,c)=>s+cpuCardValue(c)+(c.age===1?5:0),0);
   let count=cs.length;
   if(count>best.count||(count===best.count&&score>best.score))best={ids:cs.map(c=>c.uid),score,salary,count}
 }
 return best.ids
}
function cpuApplyPlan(p,activeIds,practiceIds){
 let desired=[...new Set([...activeIds,...practiceIds])],desiredSet=new Set(desired);
 // Release currently-owned players not selected.
 for(const uid of [...p.owned]){
   if(!desiredSet.has(uid))addFA(card(uid),S.room.season)
 }
 // Claim selected free agents.
 for(const uid of desired){
   let c=card(uid);if(!c)continue;
   if(c.status==="fa"){
     S.fa=S.fa.filter(x=>x!==uid);c.status="owned";c.owner=p.id;c.faSince=null
   }else{c.status="owned";c.owner=p.id}
 }
 p.owned=[...desired];
 p.active=[...activeIds];
 p.practice=[...practiceIds]
}
function cpuLegalize(p,includeFA=true){
 let plan=cpuFindActivePlan(p,includeFA);
 if(!plan&&includeFA){
   // Survival fallback: use the cheapest legal positional candidates available.
   let oldCandidate=cpuCandidateCards;
   plan=cpuFindActivePlan(p,true)
 }
 if(!plan)return false;
 let practice=cpuPracticePlan(p,plan.active,includeFA);
 cpuApplyPlan(p,plan.active,practice);
 return cpuRosterLegal(p)
}
function cpuOptimize(p){
 // Owned-only optimization. Used before waiver/FA and after camp if already legal.
 let plan=cpuFindActivePlan(p,false);
 if(!plan)return false;
 let practice=cpuPracticePlan(p,plan.active,false);
 cpuApplyPlan(p,plan.active,practice);
 return cpuRosterLegal(p)
}
function cpuBuildCurrent(){

}

}
function beginDraft(season){S.room.season=season;S.room.phase="draft";let ord=season===1?((S.room.firstDraftOrder&&S.room.firstDraftOrder.length)?[...S.room.firstDraftOrder]:sh(S.players.map(p=>p.id))):((S.nextWaiver&&S.nextWaiver.length)?[...S.nextWaiver]:waiverByPower());S.draft={order:ord,turn:0,pickLimit:{},pickedTotal:{}};let lim=pickCountForSeason(season);S.players.forEach(p=>{S.draft.pickLimit[p.id]=lim;S.draft.pickedTotal[p.id]=0});S.waiver=[...ord];S.nextWaiver=[];S.market={QB:[],HC:[],OF:[],DF:[]};let n=S.players.length,eligible=eligiblePos(season);for(const pos of POS){if(!eligible.includes(pos))continue;let qty=season===1?((pos==="QB"||pos==="HC")?n+Math.max(2,Math.ceil(n/2)):n*4):((pos==="QB"||pos==="HC")?n:n*3);S.market[pos]=sh(S.pool.filter(c=>c.pos===pos&&c.status==="free")).slice(0,qty).map(c=>c.uid)}S.viewPos=eligible[0];topNow()}
function cur(){return S.players.find(p=>p.id===S.draft.order[S.draft.turn])}function picksLeft(p){return(S.draft.pickLimit[p.id]||0)-(S.draft.pickedTotal[p.id]||0)}function done(p){return picksLeft(p)<=0}function allDone(){return S.players.every(done)}
function draftedPosCount(p,pos){return S.draftHistory.filter(x=>x.season===S.room.season&&x.playerId===p.id&&x.pos===pos).length}
function season1PosFull(p,pos){return S.room.season===1&&draftedPosCount(p,pos)>=NEED[pos]}
function moveUndraftedMarketToFA(){for(const pos of POS){for(const uid of S.market[pos]||[]){let c=card(uid);if(c&&c.status==="free")addFA(c,S.room.season)}S.market[pos]=[]}}
function setView(pos){if(eligiblePos(S.room.season).includes(pos)){S.viewPos=pos;if(isOnline())saveLocal();else save();render()}}function setRPos(pos){S.rosterPos=pos;if(isOnline())saveLocal();else save();render()}
function addHistory(p,c){let hs=S.draftHistory.filter(x=>x.season===S.room.season),overall=hs.length+1,round=Math.floor((overall-1)/S.players.length)+1,pickInRound=((overall-1)%S.players.length)+1;S.draftHistory.push({season:S.room.season,round,pickInRound,overall,playerId:p.id,playerName:p.name,uid:c.uid,pos:c.pos,rank:c.rank,power:st(c).power,salary:st(c).salary})}
function pick(uid){let p=cur(),c=card(uid);if(!p||!c||c.status!=="free"||picksLeft(p)<=0)return;if(season1PosFull(p,c.pos))return alert(`${c.pos}枠はすでに埋まっています。`);c.owner=p.id;c.status="owned";c.draftSeason=S.room.season;p.owned.push(uid);S.draft.pickedTotal[p.id]++;S.market[c.pos]=S.market[c.pos].filter(x=>x!==uid);addHistory(p,c);if(allDone()){moveUndraftedMarketToFA();beginBuild();save();render();topNow();return}do{S.draft.turn=(S.draft.turn+1)%S.players.length}while(done(cur()));save();render();topNow()}
function beginBuild(){S.room.phase="build";S.rosterPlayer=0;S.rosterPos="HC";S.players.forEach(p=>{p.active=p.active.filter(id=>p.owned.includes(id));p.practice=p.practice.filter(id=>p.owned.includes(id))})}
function setOwnedStatus(pid,uid,status){let p=S.players.find(x=>x.id===pid),c=card(uid);if(!p||!c)return;p.active=p.active.filter(x=>x!==uid);p.practice=p.practice.filter(x=>x!==uid);if(status==="active"){if(ac(p,c.pos)>=NEED[c.pos])return alert(`${c.pos}枠は埋まっています。`);p.active.push(uid)}else if(status==="practice"){if(p.practice.length>=3)return alert("PRACTICE SQUADは最大3人です。");p.practice.push(uid)}save();render()}
function addFA(c,season){if(!c)return;c.owner=null;c.status="fa";c.faSince=season;if(!S.fa.includes(c.uid))S.fa.push(c.uid)}
function cutUnkept(p){let keep=new Set([...p.active,...p.practice]),cut=p.owned.filter(id=>!keep.has(id));cut.forEach(id=>addFA(card(id),S.room.season));p.owned=p.owned.filter(id=>keep.has(id))}
function warning(p){return{over:cap(p)-capLimit(),totalOver:totalCap(p)-totalCapLimit(),missing:POS.filter(x=>ac(p,x)<NEED[x]).map(x=>`${x} ${ac(p,x)}/${NEED[x]}`),ps:p.practice.length}}
function confirmBuild(){
 let p=S.players[S.rosterPlayer],w=warning(p);
 if(w.over>0)return alert(`ACTIVE CAPを$${w.over}超過しています。`);

function buildPlayoffBracket(){let s=S.postseason.seeds,n=S.players.length,games=[];if(n===4){games=[makeLeagueGame(s[0],s[1],"playoff","CHAMPIONSHIP")]}else if(n<=6){games=[makeLeagueGame(s[1],s[2],"playoff","PLAYOFF ROUND")]}else{games=[makeLeagueGame(s[0],s[3],"playoff","SEMIFINAL"),makeLeagueGame(s[1],s[2],"playoff","SEMIFINAL")]}S.postseason.games=games;S.postseason.roundIndex=0;S.room.phase="playoffs";save();render();topNow()}

function resultsGraph(hs){
 if(!hs.length)return"<div class=desc>まだSeason結果がありません。</div>";
 const seasons=hs.map(r=>r.season).sort((a,b)=>a-b),teams=S.players.map(p=>p.id),n=S.players.length;
 const W=760,H=Math.max(250,90+(n-1)*44),L=64,R=28,T=28,B=48;
 const x=i=>seasons.length===1?(L+(W-R))/2:L+i*((W-R-L)/(seasons.length-1));
 const y=rank=>n===1?T:T+(rank-1)*((H-B-T)/(n-1));
 const colors=["#ffcf4a","#75b7ff","#78d69a","#ef8c8c","#c792ff","#66d9e8","#f0a35e","#d4dbe5"];
 let grid="";
 for(let r=1;r<=n;r++)grid+=`<line x1="${L}" y1="${y(r)}" x2="${W-R}" y2="${y(r)}" stroke="#20344a" stroke-width="1"/><text x="${L-14}" y="${y(r)+4}" text-anchor="end" fill="#9fb0c4" font-size="12">${r}位</text>`;
 seasons.forEach((s,i)=>grid+=`<line x1="${x(i)}" y1="${T}" x2="${x(i)}" y2="${H-B}" stroke="#16283a" stroke-width="1"/><text x="${x(i)}" y="${H-18}" text-anchor="middle" fill="#cbd6e1" font-size="12">S${s}</text>`);
 let lines="",legend="";
 teams.forEach((id,ti)=>{
   let p=S.players.find(x=>x.id===id),pts=[];
   seasons.forEach((ss,i)=>{let rr=hs.find(h=>h.season===ss)?.standings.find(z=>z.playerId===id);if(rr)pts.push({x:x(i),y:y(rr.rank),rank:rr.rank,season:ss})});
   let color=colors[ti%colors.length];
   if(pts.length){lines+=`<polyline points="${pts.map(q=>`${q.x},${q.y}`).join(" ")}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;pts.forEach(q=>lines+=`<circle cx="${q.x}" cy="${q.y}" r="6" fill="${color}" stroke="#08131f" stroke-width="2"><title>${p?.name||"TEAM"} / Season ${q.season} / ${q.rank}位</title></circle>`)}
   legend+=`<div class=legendChip><span class=legendDot style="background:${color}"></span>${p?.name||"TEAM"}</div>`;
 });
 return`<div class=graphLegend>${legend}</div><div class=resultGraph><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Seasonごとの順位推移"><text x="${L}" y="16" fill="#d9ad4f" font-size="12" font-weight="900">RANK HISTORY</text>${grid}${lines}</svg></div>`
}

function asArray(v){if(Array.isArray(v))return v;if(!v||typeof v!=="object")return[];return Object.keys(v).sort((a,b)=>(+a)-(+b)).map(k=>v[k]).filter(x=>x!==null&&x!==undefined)}
function normalizeRemoteState(data){
 if(!data||typeof data!=="object")return data;
 data.players=asArray(data.players);data.pool=asArray(data.pool);data.fa=asArray(data.fa);data.waiver=asArray(data.waiver);data.nextWaiver=asArray(data.nextWaiver);
 data.draftHistory=asArray(data.draftHistory);data.resultsHistory=asArray(data.resultsHistory);data.campEvents=asArray(data.campEvents);
 data.market=data.market||{};for(const pos of POS)data.market[pos]=asArray(data.market[pos]);
 data.draft=data.draft||{order:[],turn:0,pickLimit:{},pickedTotal:{}};data.draft.order=asArray(data.draft.order);
 for(const p of data.players){if(!p)continue;p.owned=asArray(p.owned);p.active=asArray(p.active);p.practice=asArray(p.practice)}
 data.regular=data.regular||{schedule:[],finalStandings:[]};data.regular.schedule=asArray(data.regular.schedule);data.regular.finalStandings=asArray(data.regular.finalStandings);
 data.postseason=data.postseason||{};for(const k of ["seeds","qualifiers","formEvents","reorgQueue","games"])data.postseason[k]=asArray(data.postseason[k]);
 if(data.gameDay){
  const g=data.gameDay;
  // Firebase Realtime Database may return empty arrays as null/absent. Recreate every GAME DAY list.
  for(const k of ["selectedA","selectedB","usedA","usedB","otUsedA","otUsedB","logs","otLogs"])g[k]=asArray(g[k]);
  if(g.last&&typeof g.last==="object"){
   g.last.aCards=asArray(g.last.aCards);g.last.bCards=asArray(g.last.bCards);
   g.last.aTags=asArray(g.last.aTags);g.last.bTags=asArray(g.last.bTags);

 }
 return data
}

async function joinOnlineRoom(){if(!readDbUrl())return;let rc=(document.getElementById("joincode")?.value||"").trim().toUpperCase();if(!rc)return alert("ROOM CODEを入力してください。");try{let room=await dbGet(`rooms/${rc}`);if(!room?.state)return alert("ROOMが見つかりません。");if(room.meta?.version&&room.meta.version!==VERSION)return alert(`ROOMのVersionは ${room.meta.version} です。Ver.${VERSION}で揃えてください。`);NET.roomCode=rc;NET.isHost=room.meta?.hostDevice===NET.deviceId;NET.members=room.members||{};let mine=NET.members[NET.deviceId];NET.localPlayerId=mine?.playerId??null;if(room.state.room?.phase!=="online_lobby"&&!mine)return alert("このROOMはすでに開始済みです。参加済み端末から再接続してください。");NET.connected=true;netSave();APPLYING_REMOTE=true;S=normalizeRemoteState(room.state);saveLocal();APPLYING_REMOTE=false;startStreams();render();topNow()}catch(e){NET.connected=false;alert(`ROOM参加に失敗しました。\n${e.message}`)}}

function onlineLobbyScreen(){let humans=S.players.filter(p=>!p.cpu),claimed=humans.filter(p=>memberForPlayer(p.id)).length,all=claimed===humans.length;return`<div class=panel><div class=stage>ONLINE LOBBY</div><div class=title>ROOM CODE</div><div class=roomCode>${esc(NET.roomCode)}</div><div class=notice>このコードを友達に送ってください。友達はこのGitHub Pagesを開き、ROOM CODEでJOINしてください。Database URLの入力は不要です。</div><div class=onlineTeams>${S.players.map(p=>{if(p.cpu)return`<div class=onlineTeam><div><b>${esc(p.name)}</b><div class=type>CPU GM</div></div><span>🤖 CPU</span></div>`;let ent=memberForPlayer(p.id),dev=ent?.[0],m=ent?.[1],mine=NET.localPlayerId===p.id;return`<div class=onlineTeam><div><b>${esc(p.name)} ${mine?"— YOU":""}</b><div class=type>HUMAN</div></div>${m?`<div><span class=claimed>CONNECTED${m.host?" / HOST":""}</span>${NET.isHost&&!m.host?`<br><button class=miniBtn onclick="releaseOnlineTeam('${dev}')">RELEASE</button>`:""}</div>`:(NET.localPlayerId===null?`<button class=miniBtn onclick=claimOnlineTeam(${p.id})>SELECT</button>`:`<span class=open>WAITING</span>`)}</div>`}).join("")}</div>${NET.isHost?`<button class=big ${all?"":"disabled"} onclick=startOnlineFranchise()>${all?"ALL PLAYERS READY — START":"HUMAN参加待ち"}</button>`:`<div class=notice>${NET.localPlayerId===null?"空いているHUMAN TEAMを選択してください。":all?"全員参加済み。HOSTのSTARTを待っています。":"他のHUMAN PLAYERの参加を待っています。"}</div>`}<button class=ghost style="width:100%;margin-top:9px" onclick=leaveOnlineRoom()>ROOMから退出</button></div>`}
async function startOnlineFranchise(){
  if(!NET.isHost)return alert("HOSTのみ開始できます。");
  if(ONLINE_TRANSITION)return;
  ONLINE_TRANSITION=true;
  try{
    NET.members=await dbGet(`rooms/${NET.roomCode}/members`)||{};
    let humans=S.players.filter(p=>!p.cpu);
    if(humans.some(p=>!memberForPlayer(p.id))){
      alert("まだ参加していないHUMAN TEAMがあります。");
      return;
    }
    S.pool=makePool();
    S.room.firstDraftOrder=sh(S.players.map(p=>p.id));
    S.room.phase="lottery";
    // Publish the LOTTERY snapshot explicitly. Do not call the removed 0.5.2 helper.
    S.room.syncRev=(S.room.syncRev||0)+1;
    S.room.syncAt=Date.now();
    saveLocal();
    render();topNow();
    await pushOnlineSnapshotNow(JSON.parse(JSON.stringify(S)),"lottery");
  }catch(e){
    NET.lastError=e.message;
    renderNetBarOnly();
    alert(`LOTTERY画面には進みましたが、Firebase同期を再試行しています。\n${e.message}`);
    queueRemoteState();
  }finally{ONLINE_TRANSITION=false}
}

/* =========================
   Ver.0.6.1 — ORDERED GAME DAY
   Regular Season games are processed strictly from the top of the schedule.
   The first pending game is the only unlocked WEEK on every device.
   ========================= */
function regularCurrentIndex(){
 let games=asArray(S.regular?.schedule),i=games.findIndex(g=>g&&g.status!=="done");
 return i<0?games.length:i
}
function regularWeekForGame(id){
 let i=asArray(S.regular?.schedule).findIndex(g=>g?.id===id);
 return i>=0?i+1:null
}
function regularCurrentGame(){
 let games=asArray(S.regular?.schedule),i=regularCurrentIndex();
 return i<games.length?games[i]:null
}
function regularGameIsCurrent(id){let g=regularCurrentGame();return !!g&&g.id===id}
function regularOrderMessage(id){
 let cur=regularCurrentGame(),w=cur?regularWeekForGame(cur.id):null;
 return cur?`現在は WEEK ${w} — ${teamById(cur.a)?.name||"TEAM"} vs ${teamById(cur.b)?.name||"TEAM"} です。上から順に進めてください。`:"REGULAR SEASONは完了しています。"
}
function pendingCpuRegular(){
 let g=regularCurrentGame();
 return g&&teamById(g.a)?.cpu&&teamById(g.b)?.cpu?g:null
}
function regularScreen(){
 let st=regularStandings(),games=asArray(S.regular?.schedule),done=games.filter(g=>g?.status==="done").length,ci=regularCurrentIndex(),cg=ci<games.length?games[ci]:null;
 let now=cg?`<div class="notice success"><b>WEEK ${ci+1} — NOW PLAYING</b><br>${esc(teamById(cg.a)?.name||"TEAM")} vs ${esc(teamById(cg.b)?.name||"TEAM")}</div>`:`<div class="notice success"><b>REGULAR SEASON COMPLETE</b></div>`;
 return`<div class=panel><div class=stage>SEASON ${S.room.season} — REGULAR SEASON</div><div class=title>${done}/${games.length} GAMES COMPLETE</div>${now}<div class=notice><b>GAME DAYはWEEK 1から上→下へ固定進行。</b> 現在のWEEKが終わると次のWEEKだけが解放されます。CPU vs CPUは順番が来たら自動SIM。HUMAN戦は該当PLAYERの端末でPLAY / SIMを選択します。順位：勝率 → 直接対決 → 得失点差 → 総得点 → TEAM POWER。</div><div class=standings><div class="standRow head"><div>RANK</div><div>TEAM</div><div>W-L</div><div>DIFF</div><div>POWER</div></div>${st.map(x=>`<div class=standRow><div class=standRank>${x.rank}</div><div>${x.playerName}${x.cpu?" 🤖":""}</div><div>${x.w}-${x.l}</div><div>${x.diff>=0?"+":""}${x.diff}</div><div>${x.power}</div></div>`).join("")}</div></div><div class=panel><div class=stage>SCHEDULE — ORDERED GAME DAY</div><div class=schedule>${games.map((g,i)=>gameRowHTML(g,i)).join("")}</div>${allRegularDone()?`<button class=big onclick=beginPostseason()>REGULAR SEASON確定 → PLAYOFFS</button>`:""}</div>`
}
function gameRowHTML(g,i){
 let a=teamById(g.a),b=teamById(g.b),done=g.status==="done",ctx=g.context==="playoff"?"playoff":"regular",cpuOnly=a?.cpu&&b?.cpu,participates=!isOnline()||NET.localPlayerId===g.a||NET.localPlayerId===g.b;
 if(ctx==="regular"){
   let idx=asArray(S.regular?.schedule).findIndex(x=>x?.id===g.id);if(idx<0)idx=i;
   let current=regularCurrentIndex(),now=!done&&idx===current,locked=!done&&!now,week=idx+1;
   let flag=done?`WEEK ${week} — COMPLETE`:now?`WEEK ${week} — NOW PLAYING`:`WEEK ${week} — LOCKED`;
   let action="";
   if(done)action=`<div class=type>${g.ot?"OT / FINAL":"FINAL"}</div>`;
   else if(locked)action=`<div class=type>🔒 WAIT</div>`;
   else if(cpuOnly)action=`<div class=type>${hostCanCpu()?"🤖 AUTO SIM":"HOST AUTO SIM"}</div>`;
   else if(participates)action=`<div class=gameActions><button onclick="startManualGame('regular','${g.id}')">PLAY</button><button onclick="simLeagueGame('regular','${g.id}')">SIM</button></div>`;
   else action=`<div class=type>OTHER PLAYERS</div>`;
   return`<div class="gameRow ${done?"done":""}" style="${now?"border-color:#e5b54f;box-shadow:0 0 0 1px rgba(229,181,79,.2)":""}"><div class=type style="grid-column:1/-1;${now?"color:#e5b54f;font-weight:900":""}">${flag}</div><div class=gameTeam>${a?.name||"TEAM"}${a?.cpu?" 🤖":""}</div><div class=gameScore>${done?`${g.scoreA}-${g.scoreB}`:"VS"}</div><div class="gameTeam right">${b?.name||"TEAM"}${b?.cpu?" 🤖":""}</div>${action}</div>`
 }
 let allowHuman=!cpuOnly&&participates,allowCpu=cpuOnly&&hostCanCpu();
 return`<div class="gameRow ${done?"done":""}"><div class=gameTeam>${a?.name||"TEAM"}${a?.cpu?" 🤖":""}</div><div class=gameScore>${done?`${g.scoreA}-${g.scoreB}`:"VS"}</div><div class="gameTeam right">${b?.name||"TEAM"}${b?.cpu?" 🤖":""}</div>${!done&&allowHuman?`<div class=gameActions><button onclick="startManualGame('${ctx}','${g.id}')">PLAY</button><button onclick="simLeagueGame('${ctx}','${g.id}')">SIM</button></div>`:!done&&allowCpu&&!isOnline()?`<div class=gameActions><button onclick="simLeagueGame('${ctx}','${g.id}')">SIM</button></div>`:!done?`<div class=type>${cpuOnly?"AUTO SIM":"OTHER PLAYER"}</div>`:`<div class=type>${g.ot?"OT":"FINAL"}</div>`}</div>`
}
function startManualGame(context,id){

function simLeagueGame(context,id){

function gdScoreboard(g){
 let a=gdTeam(g,"A"),b=gdTeam(g,"B"),e=gdEdges(g),logs=asArray(g.logs),week=g.context==="regular"?regularWeekForGame(g.gameId):null,header=week?`<div class=stage style="margin-bottom:8px;color:#e5b54f">WEEK ${week} — GAME DAY</div>`:g.context==="playoff"?`<div class=stage style="margin-bottom:8px">PLAYOFF GAME DAY</div>`:"";

/* =========================
   Ver.0.6.1 — SIMULTANEOUS ONLINE ROSTER BUILD
   Draft order stays sequential. The first post-draft ROSTER BUILD is parallel for HUMAN teams.
   FINAL ROSTER / FA remains waiver-order sequential because the FA pool is shared.
   Each HUMAN build is stored under rooms/{ROOM}/builds/{season}/{playerId}, so simultaneous
   edits never overwrite another player's roster in the shared root state.
   ========================= */
let BUILD_QUEUE=Promise.resolve(),ONLINE_BUILD_FINALIZING=false;

function buildSeasonKey(){return String(S?.room?.season||1)}
function onlineBuildMap(){return NET.builds&&typeof NET.builds==="object"?NET.builds:{}}
function onlineBuildEntry(pid){return onlineBuildMap()[String(pid)]||onlineBuildMap()[pid]||null}
function sanitizeBuildIds(p,ids){let own=new Set(asArray(p?.owned));return [...new Set(asArray(ids).filter(id=>own.has(id)))]}
function applyBuildEntryToPlayer(p,e){
 if(!p||!e)return;
 let active=sanitizeBuildIds(p,e.active),activeSet=new Set(active),practice=sanitizeBuildIds(p,e.practice).filter(id=>!activeSet.has(id));
 p.active=active;p.practice=practice
}
function mergeOnlineBuildDrafts(){
 if(!isOnline()||S?.room?.phase!=="build")return;
 for(const p of S.players){let e=onlineBuildEntry(p.id);if(e)applyBuildEntryToPlayer(p,e)}
}
function onlineBuildProgressHTML(){
 let rows=S.players.map(p=>{
   if(p.cpu)return`<div class=onlineTeam><div><b>${esc(p.name)}</b><div class=type>CPU GM</div></div><span class=claimed>AUTO</span></div>`;
   let e=onlineBuildEntry(p.id),ready=!!e?.ready,mine=NET.localPlayerId===p.id;
   return`<div class=onlineTeam><div><b>${esc(p.name)}${mine?" — YOU":""}</b><div class=type>HUMAN</div></div><span class="${ready?"claimed":"open"}">${ready?"✓ READY":"BUILDING"}</span></div>`
 }).join("");
 return`<div class=panel><div class=stage>ONLINE ROSTER BUILD</div><div class=title>ALL HUMAN TEAMS — SIMULTANEOUS</div><div class=notice>ドラフト後の第1次ROSTER BUILDは各HUMANが同時に操作できます。全HUMANがREADYになると、CPU編成を確定してTraining Campへ自動で進みます。<br><b>Training Camp後のFINAL ROSTER / FAは従来どおりWAIVER順で1TEAMずつです。</b></div><div class=onlineTeams>${rows}</div></div>`
}
function onlineBuildWaitHTML(){return`${onlineBuildProgressHTML()}<div class=panel><div class=seasoncard><div class=waitIcon>✓</div><div class=stage>ROSTER LOCKED</div><div class=title>あなたのROSTERは確定済み</div><div class=notice>ほかのHUMAN TEAMの確定を待っています。全員READYになると自動でTraining Campへ進みます。</div></div></div>`}

function beginBuild(){
 if(!isOnline()){S.room.phase="build";S.rosterPlayer=0;S.rosterPos="HC";S.players.forEach(p=>{p.active=p.active.filter(id=>p.owned.includes(id));p.practice=p.practice.filter(id=>p.owned.includes(id))});return}
 S.room.phase="build";S.rosterPlayer=0;S.rosterPos="HC";
 S.players.forEach(p=>{p.active=asArray(p.active).filter(id=>asArray(p.owned).includes(id));p.practice=asArray(p.practice).filter(id=>asArray(p.owned).includes(id))});
 NET.builds={}
}

function queueOnlineBuildSnapshot(p,ready=false){
 if(!isOnline()||S.room.phase!=="build"||!p)return Promise.resolve();
 let entry={playerId:p.id,active:[...asArray(p.active)],practice:[...asArray(p.practice)],ready:!!ready,updatedAt:Date.now(),deviceId:NET.deviceId};
 NET.builds=onlineBuildMap();NET.builds[String(p.id)]=entry;
 saveLocal();
 let room=NET.roomCode,season=buildSeasonKey();
 BUILD_QUEUE=BUILD_QUEUE.catch(()=>{}).then(async()=>{
   try{await dbWriteRetry(()=>dbPut(`rooms/${room}/builds/${season}/${p.id}`,entry),2);NET.connected=true;NET.lastError=""}
   catch(e){NET.lastError=e.message;console.error("build sync",e);renderNetBarOnly();throw e}
 });
 return BUILD_QUEUE
}

function setOwnedStatus(pid,uid,status){
 if(!isOnline()||S.room.phase!=="build"){let p=S.players.find(x=>x.id===pid),c=card(uid);if(!p||!c)return;p.active=p.active.filter(x=>x!==uid);p.practice=p.practice.filter(x=>x!==uid);if(status==="active"){if(ac(p,c.pos)>=NEED[c.pos])return alert(`${c.pos}枠は埋まっています。`);p.active.push(uid)}else if(status==="practice"){if(p.practice.length>=3)return alert("PRACTICE SQUADは最大3人です。");p.practice.push(uid)}save();render();return}
 if(NET.localPlayerId!==pid)return;
 let p=teamById(pid),c=card(uid),e=onlineBuildEntry(pid);if(!p||!c||p.cpu||e?.ready)return;
 p.active=asArray(p.active).filter(x=>x!==uid);p.practice=asArray(p.practice).filter(x=>x!==uid);
 if(status==="active"){
   if(ac(p,c.pos)>=NEED[c.pos])return alert(`${c.pos}枠は埋まっています。`);
   p.active.push(uid)
 }else if(status==="practice"){
   if(p.practice.length>=3)return alert("PRACTICE SQUADは最大3人です。");
   p.practice.push(uid)
 }
 queueOnlineBuildSnapshot(p,false);render()
}

 let p=localTeam();if(!p||p.cpu)return;
 if(onlineBuildEntry(p.id)?.ready)return;
 let w=warning(p);
 if(w.over>0)return alert(`ACTIVE CAPを$${w.over}超過しています。`);
 if(w.totalOver>0)return alert(`TOTAL CAPを$${w.totalOver}超過しています。`);
 if(w.ps>3)return alert("PRACTICE SQUADは3人までです。");
 if(w.missing.length&&!confirm(`空席：${w.missing.join(" / ")}\nTraining Camp後のFINAL ROSTERでFA補強できます。このロスターでCampへ進みますか？`))return;

 }catch(e){alert(`ROSTER確定の同期に失敗しました。\n${e.message}`)}
}

 return`${onlineBuildProgressHTML()}<div class=panel><div class=stage>SEASON ${S.room.season} — YOUR ROSTER BUILD</div><div class=title>${esc(p.name)}</div><div class=summary><div class=metric><div class=k>TEAM POWER</div><div class=v>${power(p)}</div></div><div class=metric><div class=k>ACTIVE CAP</div><div class=v>$${cap(p)}/$${capLimit()}</div></div><div class=metric><div class=k>TOTAL CAP</div><div class=v>$${totalCap(p)}/$${totalCapLimit()}</div></div><div class=metric><div class=k>ROSTER</div><div class=v>${p.active.length}/8</div></div><div class=metric><div class=k>PRACTICE</div><div class=v>${p.practice.length}/3</div></div></div><div class=notice>HC ${ac(p,"HC")}/1 QB ${ac(p,"QB")}/1 OF ${ac(p,"OF")}/3 DF ${ac(p,"DF")}/3 | HC MULT ×${hcMultiplier(p).toFixed(2)}</div>${w.over>0?`<div class="notice warning">CAP OVER $${w.over}</div>`:""}</div><div class=panel><div class=tabs>${POS.map(x=>`<button class="tab ${x===pos?"on":""}" onclick="setRPos('${x}')">${x}<br>${asArray(p.owned).map(card).filter(c=>c&&c.pos===x).length}</button>`).join("")}</div><div class=grid>${list.map(c=>playerCard(p,c)).join("")||"<div class=desc>選手なし</div>"}</div><button class=big onclick=confirmBuild()>このROSTERでREADY</button></div>`

async function maybeFinalizeOnlineBuild(){
 if(!isOnline()||!NET.isHost||S.room.phase!=="build"||ONLINE_BUILD_FINALIZING)return;
 ONLINE_BUILD_FINALIZING=true;
 try{
   let season=buildSeasonKey(),builds=await dbGet(`rooms/${NET.roomCode}/builds/${season}`)||{};
   NET.builds=builds;
   let humans=S.players.filter(p=>!p.cpu);
   if(humans.some(p=>!((builds[String(p.id)]||builds[p.id])?.ready)))return;
   let remote=await dbGet(`rooms/${NET.roomCode}/state`);if(remote)S=normalizeRemoteState(remote);
   S.room.phase="build";
   for(const p of S.players.filter(x=>!x.cpu)){
     let e=builds[String(p.id)]||builds[p.id];applyBuildEntryToPlayer(p,e);cutUnkept(p)
   }
   for(const p of S.players.filter(x=>x.cpu))cpuOptimize(p);

}

/* ---------- Training Camp: personality + one headline ---------- */
const CAMP_NORMAL_VALUES=[-5,-3,0,3,5];
const CAMP_HEADLINE_VALUES=[-15,-10,-5,0,5,10,15];
const CAMP_NORMAL_NAMES={"-5":"SLUMP","-3":"ROUGH CAMP","0":"STEADY","3":"GOOD CAMP","5":"GROWTH"};
const CAMP_HEADLINE_NAMES={"-15":"COLLAPSE","-10":"MAJOR SLUMP","-5":"SETBACK","0":"STEADY","5":"BIG STEP","10":"BREAKOUT","15":"MEGA BREAKOUT"};
function campWeights(c,headline=false){
 let t=traitLabel(c),age=c?.age||1;
 if(!headline){
   if(t==="一発屋")return[24,14,24,14,24];
   if(t==="晩成")return age===1?[12,22,30,24,12]:age===2?[8,16,26,28,22]:[7,14,24,29,26];
   if(t==="即戦力")return age===1?[7,14,24,29,26]:age===2?[10,20,30,25,15]:[12,23,30,23,12];
   return[12,23,30,23,12]
 }
 if(t==="一発屋")return[22,13,7,16,7,13,22];
 if(t==="晩成")return age===1?[5,10,20,30,20,10,5]:age===2?[4,7,13,23,24,17,12]:[3,6,11,20,24,20,16];
 if(t==="即戦力")return age===1?[3,6,11,20,24,20,16]:age===2?[4,8,15,27,24,14,8]:[5,10,20,30,20,10,5];

}
function weightedValue(values,weights){let total=weights.reduce((a,b)=>a+b,0),r=Math.random()*total,n=0;for(let i=0;i<values.length;i++){n+=weights[i];if(r<n)return values[i]}return values[Math.floor(values.length/2)]}
function campRoll(c,headline=false){let values=headline?CAMP_HEADLINE_VALUES:CAMP_NORMAL_VALUES,v=weightedValue(values,campWeights(c,headline));return{name:(headline?CAMP_HEADLINE_NAMES:CAMP_NORMAL_NAMES)[String(v)],value:v,headline}}
function applyCamp(){
 S.campEvents=[];
 for(const p of S.players){
   let eligible=sh([...new Set([...asArray(p.active),...asArray(p.practice)])].map(card).filter(Boolean)).slice(0,5);
   if(!eligible.length)continue;
   let headlineIndex=ri(0,eligible.length-1);
   eligible.forEach((c,i)=>{
     let headline=i===headlineIndex,e=campRoll(c,headline),current=persistentModTotal(c),applied=clamp(current+e.value,-15,15)-current;
     if(!c.mods)c.mods=[];
     if(applied)c.mods.push({value:applied,remaining:2,source:headline?"CAMP_HEADLINE":"CAMP"});
     S.campEvents.push({playerId:p.id,playerName:p.name,uid:c.uid,pos:c.pos,rank:c.rank,type:traitLabel(c),age:c.age,name:e.name,value:applied,rolled:e.value,headline})
   })
 }
}

let GAME_CHOICE_QUEUE=Promise.resolve(),ONLINE_GD_RESOLVING=false;
let LOCAL_GAME_DRAFT={key:"",selected:[],ready:false};
function onlineGameSide(g){if(!g||!isOnline())return null;return NET.localPlayerId===g.aId?"A":NET.localPlayerId===g.bId?"B":null}
function gameRoundKey(g){return String(g?.phase||"").startsWith("ot")?`ot${g.otRound}`:`q${g.quarter}`}
function gameDraftKey(g,side){return`${g?.gameId||"game"}|${gameRoundKey(g)}|${side||"X"}|${NET.localPlayerId}`}
function gameChoiceMap(){return NET.gameChoices&&typeof NET.gameChoices==="object"?NET.gameChoices:{}}
function gameChoiceEntryForSide(g,side,map=gameChoiceMap()){let pid=side==="A"?g?.aId:g?.bId;return map?.[String(pid)]||map?.[pid]||null}
function localGameDraft(g,side){let key=gameDraftKey(g,side);if(LOCAL_GAME_DRAFT.key!==key){let e=gameChoiceEntryForSide(g,side);LOCAL_GAME_DRAFT={key,selected:[...asArray(e?.selected)],ready:!!e?.ready}}return LOCAL_GAME_DRAFT}
function resetLocalGameDraft(){LOCAL_GAME_DRAFT={key:"",selected:[],ready:false}}
function currentGameChoicePath(g){return`rooms/${NET.roomCode}/gameChoices/${g.gameId}/${gameRoundKey(g)}`}
function queueGameChoice(g,side,ready=false){
 if(!isOnline()||!g||!side)return Promise.resolve();let d=localGameDraft(g,side),pid=side==="A"?g.aId:g.bId,entry={playerId:pid,side,selected:[...d.selected],ready:!!ready,updatedAt:Date.now(),deviceId:NET.deviceId};d.ready=!!ready;NET.gameChoices=gameChoiceMap();NET.gameChoices[String(pid)]=entry;let path=`${currentGameChoicePath(g)}/${pid}`;
 GAME_CHOICE_QUEUE=GAME_CHOICE_QUEUE.catch(()=>{}).then(async()=>{try{await dbWriteRetry(()=>dbPut(path,entry),2);NET.connected=true;NET.lastError=""}catch(e){NET.lastError=e.message;renderNetBarOnly();throw e}});return GAME_CHOICE_QUEUE
}
function gdSelect(uid){

 if(!isOnline()){let side=String(g.phase||"").endsWith("B")?"B":"A",sel=side==="A"?g.selectedA:g.selectedB,avail=gdAvailable(g,side);if(!avail.some(c=>c.uid===uid))return;let i=sel.indexOf(uid);if(i>=0)sel.splice(i,1);else if(sel.length<2)sel.push(uid);save();render();return}
 if(g.phase!=="selectA")return;let side=onlineGameSide(g);if(!side)return;let d=localGameDraft(g,side);if(d.ready)return;let avail=gdAvailable(g,side);if(!avail.some(c=>c.uid===uid))return;let i=d.selected.indexOf(uid);if(i>=0)d.selected.splice(i,1);else if(d.selected.length<2)d.selected.push(uid);queueGameChoice(g,side,false);render()

 if(g.phase!=="selectA")return;let side=onlineGameSide(g);if(!side)return;let d=localGameDraft(g,side);if(d.ready)return;if(d.selected.length!==2)return alert("2枚選択してください。");try{await queueGameChoice(g,side,true);render();if(NET.isHost)await maybeResolveOnlineGameRound()}catch(e){alert(`カード確定の同期に失敗しました。\n${e.message}`)}

 if(isOnline()){

 }

async function maybeResolveOnlineGameRound(){
 if(!isOnline()||!NET.isHost||S.room.phase!=="game_day"||ONLINE_GD_RESOLVING)return;
 ONLINE_GD_RESOLVING=true;
 try{
   let room=await dbGet(`rooms/${NET.roomCode}`);if(!room?.state)return;let state=normalizeRemoteState(room.state),g=state.gameDay;if(!g||state.room?.phase!=="game_day")return;
   let ot=String(g.phase||"").startsWith("ot");if((!ot&&g.phase!=="selectA")||(ot&&g.phase!=="ot_selectA"))return;
   let roundKey=gameRoundKey(g),map=room.gameChoices?.[g.gameId]?.[roundKey]||{},need=ot?1:2;
   let ids={};
   for(const side of ["A","B"]){let control=side==="A"?g.controlA:g.controlB,pid=side==="A"?g.aId:g.bId;if(control==="cpu"){let tmpS=S;S=state;try{ids[side]=ot?[gdCpuOT(g,side).uid]:gdCpuChoose(g,side).map(c=>c.uid)}finally{S=tmpS}}else{let e=map[String(pid)]||map[pid];if(!e?.ready||asArray(e.selected).length!==need)return;ids[side]=asArray(e.selected)}}
   APPLYING_REMOTE=true;S=state;APPLYING_REMOTE=false;g=S.gameDay;g.selectedA=[...ids.A];g.selectedB=[...ids.B];
   if(ot){let a=card(g.selectedA[0]),b=card(g.selectedB[0]);if(!a||!b)return;gdResolveOT(g,a,b);g.selectedA=[];g.selectedB=[];g.phase="ot_result"}
   else{let a=g.selectedA.map(card).filter(Boolean),b=g.selectedB.map(card).filter(Boolean);if(a.length!==2||b.length!==2)return;gdResolveQuarter(g,a,b);g.selectedA=[];g.selectedB=[];g.phase="result"}
   S.room.syncRev=(S.room.syncRev||0)+1;S.room.syncAt=Date.now();saveLocal();resetLocalGameDraft();NET.gameChoices={};render();topNow();await pushOnlineSnapshotNow(JSON.parse(JSON.stringify(S)),"game_day");try{await dbDelete(`rooms/${NET.roomCode}/gameChoices/${g.gameId}/${roundKey}`)}catch(e){console.warn("game choice cleanup",e)}
 }catch(e){NET.lastError=e.message;console.error("game resolve",e);renderNetBarOnly()}
 finally{ONLINE_GD_RESOLVING=false}
}

   let room=await dbGet(`rooms/${NET.roomCode}`);if(!room){if(!NET.isHost){clearOnlineSession();S=fresh();saveLocal();render();alert("オンラインROOMが終了しました。")}return}
   NET.members=room.members||{};NET.connected=true;
   if(room.state?.room?.phase==="build")NET.builds=(room.builds||{})[String(room.state.room.season)]||{};else NET.builds={};
   let rg=room.state?.gameDay;if(room.state?.room?.phase==="game_day"&&rg){NET.gameChoices=room.gameChoices?.[rg.gameId]?.[String(rg.phase||"").startsWith("ot")?`ot${rg.otRound}`:`q${rg.quarter}`]||{}}else{NET.gameChoices={};resetLocalGameDraft()}
   if(room.state)applyRemoteState(room.state);
   if(S.room.phase==="build"){mergeOnlineBuildDrafts();saveLocal();render();if(NET.isHost)maybeFinalizeOnlineBuild()}
   if(S.room.phase==="game_day"){render();if(NET.isHost)maybeResolveOnlineGameRound()}
 }catch(e){NET.connected=false;NET.lastError=e.message;renderNetBarOnly()}
}
async function resumeOnline(){
 if(!NET.roomCode||!dbReady())return;
 try{
   let room=await dbGet(`rooms/${NET.roomCode}`);if(!room){clearOnlineSession();return}
   NET.members=room.members||{};let mine=NET.members[NET.deviceId];if(mine)NET.localPlayerId=mine.playerId??null;NET.connected=true;
   if(room.state){APPLYING_REMOTE=true;S=normalizeRemoteState(room.state);NET.builds=S.room?.phase==="build"?((room.builds||{})[String(S.room.season)]||{}):{};let g=S.gameDay;NET.gameChoices=S.room?.phase==="game_day"&&g?(room.gameChoices?.[g.gameId]?.[gameRoundKey(g)]||{}):{};mergeOnlineBuildDrafts();saveLocal();APPLYING_REMOTE=false}
   startStreams();render();if(S.room.phase==="build"&&NET.isHost)maybeFinalizeOnlineBuild();if(S.room.phase==="game_day"&&NET.isHost)maybeResolveOnlineGameRound()
 }catch(e){NET.connected=false;NET.lastError=e.message;render()}
}
function clearOnlineSession(keepDb=true){closeStreams();let db=NET.dbUrl,dev=NET.deviceId;NET={dbUrl:keepDb?db:"",roomCode:"",deviceId:dev||deviceCode(),localPlayerId:null,isHost:false,connected:false,members:{},builds:{},gameChoices:{},lastError:""};resetLocalGameDraft();netSave()}

function cpuLater(fn,ms){if(CPU_TIMER)clearTimeout(CPU_TIMER);CPU_TIMER=setTimeout(()=>{CPU_TIMER=null;fn()},ms)}
async function forceOnlineRefresh(){try{await refreshRemoteSnapshots();topNow()}catch(e){alert(`同期再取得に失敗しました。\n${e.message}`)}}
function resetGame(){if(isOnline())return leaveOnlineRoom();if(confirm("リセットしますか？")){S=fresh();S.room.phase="home";saveLocal();render()}}

function render(){
 if(CPU_TIMER){clearTimeout(CPU_TIMER);CPU_TIMER=null}
 let g=document.getElementById("game");if(!g)return;let html="";
 try{
  if(S.room.phase==="home")html=homeScreen();
  else if(S.room.phase==="online_hub")html=onlineHubScreen();
  else if(S.room.phase==="online_setup"){html=onlineSetupScreen();setTimeout(onlineInputs,0)}
  else if(S.room.phase==="online_lobby")html=onlineLobbyScreen();
  else if(S.room.phase==="setup"){html=setup();setTimeout(inputs,0)}
  else if(S.room.phase==="lottery"){html=lotteryScreen();if(isOnline()&&!NET.isHost)html=disableExactAction(html,"startSeason1Draft")}
  else if(S.room.phase==="draft"){html=draft();if(cur()?.cpu&&hostCanCpu())cpuLater(cpuPick,350)}
  else if(S.room.phase==="build"){html=build();if(!isOnline()&&S.players[S.rosterPlayer]?.cpu)cpuLater(cpuBuildCurrent,450)}
  else if(S.room.phase==="final"){html=finalScreen();if(fplayer()?.cpu&&hostCanCpu())cpuLater(cpuFinalCurrent,450)}
  else if(S.room.phase==="camp"){html=campScreen();if(isOnline()&&!NET.isHost)html=disableExactAction(html,"beginFinal")}
  else if(S.room.phase==="camp_reorg")html=campReorgOnlineScreen();
  else if(S.room.phase==="regular"){html=regularScreen();if(isOnline()&&!NET.isHost)html=disableExactAction(html,"beginPostseason");let cg=pendingCpuRegular();if(cg&&hostCanCpu())cpuLater(()=>simLeagueGame("regular",cg.id),380)}
  else if(S.room.phase==="game_day")html=gameDayScreen();
  else if(S.room.phase==="playoff_form"){html=playoffFormScreen();if(isOnline()&&!NET.isHost)html=disableExactAction(html,"beginPlayoffReorg")}
  else if(S.room.phase==="playoff_reorg")html=playoffReorgOnlineScreen();
  else if(S.room.phase==="playoffs"){html=playoffScreen();let pg=pendingCpuPlayoff();if(pg&&hostCanCpu())cpuLater(()=>simLeagueGame("playoff",pg.id),420)}
  else if(S.room.phase==="season_end"){html=seasonEnd();if(isOnline()&&!NET.isHost)html=disableExactAction(html,"advance")}
  else html=`<div class=panel><div class=seasoncard><div class=stage>VER.0.6.1 COMPLETE</div><div class=title>${S.room.maxSeason} SEASONS COMPLETE</div><div class=notice>最終ロスターはROSTERS、全Seasonの順位推移・Regular Season・Playoff ChampionはRESULTSから確認できます。</div><button class=ghost style="width:100%;margin-top:10px" onclick=goHome()>HOME</button></div></div>`;
  g.innerHTML=(isOnline()?networkBar():"")+html;
 }catch(e){
  console.error("RENDER ERROR",e);
  let msg=esc(e?.message||String(e)),phase=esc(S?.room?.phase||"unknown");
  g.innerHTML=(isOnline()?networkBar():"")+`<div class=panel><div class=stage>DISPLAY RECOVERY</div><div class=title>画面を再同期します</div><div class=notice>同期データは受信していますが、画面生成でエラーが発生しました。<br>PHASE: ${phase}<br>ERROR: ${msg}</div><button class=big onclick=forceOnlineRefresh()>SYNC RETRY</button></div>`;
 }
}
window.addEventListener("beforeunload",()=>{try{STATE_STREAM?.close();MEMBER_STREAM?.close()}catch(e){}});
setTimeout(()=>{if(NET.roomCode&&dbReady())resumeOnline()},0);

render();
</script>
</body></html>
